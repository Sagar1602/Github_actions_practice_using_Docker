name: 04-using-actions
on: push
jobs:
  code_checkout:
    runs-on: ubuntu-latest
    steps:
      - name: code_checkout
        uses: actions/checkout@v4

      - name: printing folder 
        run: tree

  node-setup:
    runs-on: ubuntu-latest
    steps:
      - name: setup of node js 
        uses: actions/setup-node@v4       