name: 12- Working With Outputs
on: 
  workflow_dispatch:
    inputs:
      build-status:
        types: choice
        default: success
        options: 
          - success
          - failure
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Print GITHUB_OUTPUT path
        run: echo $GITHUB_OUTPUT   

      - name: BUILD
        id: build
        run: |
          echo "status= ${{ inputs.build-status }}">> "$GITHUB_OUTPUT"     

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: deploy
        run: |
          echo "status=${{needs.build.build-status == 'success'}}"          
