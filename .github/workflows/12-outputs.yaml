name: 12- Working With Outputs
on: 
  workflow_dispatch:
    inputs:
      build-status:
        types: choice
        default: failure
        options: 
          - success
          - failure
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Print GITHUB_OUTPUT path
        run: echo $GITHUB_OUTPUT   

      - name: BUILD
        id: build
        run: |
          echo "status= ${{ inputs.build-status }}">> "$GITHUB_OUTPUT"     

  deploy:
    runs-on: ubuntu-latest
    needs: build
   
    steps:
      - name: deploy
        if: ${{needs.build.build-status == 'failure'}}
        run: echo "Deploying"          
