name: 07-expressions
on: 
  push:
  workflow_dispatch:
    inputs:
      debug:
        default: false
        types: boolean
jobs:
  print_Commands:
    runs-on: ubuntu-latest
    steps:
      - name: print
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: echo "this is printing statement"        
    